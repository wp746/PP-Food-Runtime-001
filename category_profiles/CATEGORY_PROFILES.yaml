routing_rules:
  primary_profile_count: 1
  weak_auxiliary_profile_count_max: 1
  category_weight: 0.70
  brand_positioning_weight: 0.30
  low_confidence_behavior: conservative_food_ad_base
  previous_job_profile_reuse: forbidden_unless_user_explicitly_requests
  visual_director_required_for_B: true
  creative_board_candidate_count: 3
  candidate_skeletons_must_be_distinct: true
  only_winner_reaches_image_model: true
  kv_mode_default: TRUE_UPPER_BOUND
  atmosphere_evidence_minimum: 3
  anti_template_checks_composition_skeleton: true
  material_swap_is_not_new_concept: true
  different_category_requires_major_redesign: true
  upper_bound_is_not_decoration_count: true
