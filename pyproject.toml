[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-food-runtime"
version = "0.1.0"
description = "Local-first PP Food validation engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "typer>=0.12",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ppfood = "pp_food_runtime.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["integration: opt-in provider or end-to-end integration tests"]
testpaths = ["tests"]

